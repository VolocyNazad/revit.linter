name: Publish release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Verify release tag
        shell: pwsh
        run: |
          $tags = @(git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          if ($tags.Count -ne 1) {
            throw "The selected commit must have exactly one stable tag such as 'v1.4.0'."
          }

      - name: Verify release changelog
        shell: pwsh
        run: |
          $tag = @(git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })[0]
          $version = $tag.Substring(1)
          $lines = @(Get-Content -LiteralPath CHANGELOG.md -Encoding utf8)

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[Unreleased\]') { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## [Unreleased]' section."
          }

          $pending = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) {
            if ($lines[$i].Trim() -and $lines[$i] -notmatch '^###\s') { $pending += $lines[$i] }
          }
          if ($pending.Count -gt 0) {
            throw "CHANGELOG.md still has $($pending.Count) unreleased line(s). Move them into the '## [$version]' section before publishing."
          }

          $heading = "## [$version]"
          $released = @($lines | Where-Object { $_.StartsWith($heading, [StringComparison]::Ordinal) })
          if ($released.Count -ne 1) {
            throw "CHANGELOG.md must contain exactly one '$heading - YYYY-MM-DD' section for the release tag $tag."
          }

      - name: Build and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet run `
            --project build/Revit.Linter.Build.csproj `
            -c Release `
            --no-launch-profile `
            -- publish --Publish:Draft=${{ inputs.draft }}
