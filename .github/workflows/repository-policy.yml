name: Repository policy

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate required files, links and Solution Items
        shell: pwsh
        run: ./scripts/Validate-Repository.ps1

      - name: Verify the changelog and release inputs
        shell: pwsh
        run: ./scripts/Verify-Release.ps1
