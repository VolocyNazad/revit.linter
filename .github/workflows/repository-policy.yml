name: Repository policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files, links and Solution Items
        shell: pwsh
        run: ./scripts/Validate-Repository.ps1
