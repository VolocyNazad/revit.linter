name: Publish wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/Prepare-Wiki.ps1'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare wiki
        shell: pwsh
        run: ./scripts/Prepare-Wiki.ps1

      - name: Publish wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: .wiki-publish/
          disable-empty-commits: true
          ignore: ".obsidian/"
