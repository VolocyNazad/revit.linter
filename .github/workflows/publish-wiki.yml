name: Publish wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/Prepare-Wiki.ps1'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

concurrency:
  group: publish-wiki
  # The publication is idempotent but a cancelled run does not retry itself; queue the next push
  # instead of dropping it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the publication branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw "The wiki is published from main only; this run targets '${{ github.ref }}'."
          }

      - name: Prepare wiki
        shell: pwsh
        run: ./scripts/Prepare-Wiki.ps1

      - name: Publish wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5
        with:
          path: .wiki-publish/
          disable-empty-commits: true
          ignore: ".obsidian/"
