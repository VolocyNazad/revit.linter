name: Build and test

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release_2021.1.100
          - Release_2022.1.80
          - Release_2023.1.90
          - Release_2024.3.60
          - Release_2025.4.60
          - Release_2026.4.10
          - Release_2027.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/Directory.Packages.props
            **/nuget.config

      - name: Build solution
        shell: pwsh
        run: dotnet build Revit.Linter.slnx --configuration "${{ matrix.configuration }}" -p:TreatWarningsAsErrors=true /nologo

      - name: Run headless tests
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/Invoke-HeadlessTests.ps1 -Configuration "${{ matrix.configuration }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults/${{ matrix.configuration }}
          if-no-files-found: ignore

  build-units:
    name: Build build and installer units
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/Directory.Packages.props
            **/nuget.config

      - name: Build build solution
        shell: pwsh
        run: dotnet build build/Revit.Linter.Build.slnx --configuration Release /nologo

      - name: Build installer project
        shell: pwsh
        run: dotnet build installer/Revit.Linter.Installer/Revit.Linter.Installer.csproj --configuration Release /nologo

  updater:
    name: Build and test updater
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/Directory.Packages.props
            **/nuget.config

      - name: Build updater solution
        shell: pwsh
        run: dotnet build updater/Revit.Linter.Updater.slnx --configuration Release /nologo

      - name: Run updater tests
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/Invoke-HeadlessTests.ps1 -Configuration Release -TestsDirectory updater/tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-updater
          path: TestResults/Release
          if-no-files-found: ignore
