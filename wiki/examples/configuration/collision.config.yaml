- code: "CLSN001"
  description: "custom"
  message: "Element named '{elementName}' with identifier '{elementId}' intersects {intersection.count} element(s) '{intersection.elementNames}' with identifiers '{intersection.elementIds}'. Execution time '{duration}' ms."
  severity: "Warning"
  isActive: true
  takeDocument: "property('Title') != '' & !property('IsFamilyDocument')"
  take: "instance and (class('Pipe') or class('Duct') or class('CableTray') or class('Conduit') or builtincategory('OST_DuctFitting') or builtincategory('OST_PipeFitting') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_ConduitFitting'))"
  andTake: "instance and (class('Pipe') or class('Duct') or class('CableTray') or class('Conduit') or builtincategory('OST_DuctFitting') or builtincategory('OST_PipeFitting') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_ConduitFitting'))"
  groupBy: "parameter(me, 'Комментарии')"
  visualizations:
    - name: "Show collision"
      steps:
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Select collision"
      steps:
        - type: "Select"
          elementSets: ["Target", "Dependencies"]
    - name: "Isolate collision"
      steps:
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
    - name: "Cut collision"
      steps:
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
    - name: "Override collision elements"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            transparency: 15
            projectionLines:
              color: "#E53935"
              weight: 6
            surfaceForeground:
              color: "#E53935"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            transparency: 35
            projectionLines:
              color: "#43A047"
              weight: 6
            surfaceForeground:
              color: "#43A047"
              pattern: "SolidFill"
              isVisible: true
    - name: "Override collision filters"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            transparency: 10
            projectionLines:
              color: "#FF9800"
              weight: 8
            surfaceForeground:
              color: "#FF9800"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideFilter"
          elementSets: ["Dependencies"]
          style:
            halftone: true
            transparency: 45
            projectionLines:
              color: "#1E88E5"
              weight: 5
            surfaceForeground:
              color: "#1E88E5"
              pattern: "SolidFill"
              isVisible: true
    - name: "Filters, cut and show collision"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            transparency: 10
            projectionLines:
              color: "#FF5722"
              weight: 8
            surfaceForeground:
              color: "#FF5722"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideFilter"
          elementSets: ["Dependencies"]
          style:
            halftone: true
            transparency: 45
            projectionLines:
              color: "#2196F3"
              weight: 5
            surfaceForeground:
              color: "#2196F3"
              pattern: "SolidFill"
              isVisible: true
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Override, isolate and cut collision"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            transparency: 5
            projectionLines:
              color: "#F44336"
              weight: 8
            surfaceForeground:
              color: "#F44336"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            transparency: 25
            projectionLines:
              color: "#4CAF50"
              weight: 6
            surfaceForeground:
              color: "#4CAF50"
              pattern: "SolidFill"
              isVisible: true
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
