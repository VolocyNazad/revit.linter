- code: "CLSN001"
  description: "custom"
  message: "Element named '{elementName}' with identifier '{elementId}' intersects element '{intersection.elementName}' with identifier '{intersection.elementId}'. Execution time '{duration}' ms."
  severity: "Warning"
  isActive: true
  takeDocument: "property('Title') != '' & !property('IsFamilyDocument')"
  take: "instance and (class('Pipe') or class('Duct') or class('CableTray') or class('Conduit') or builtincategory('OST_DuctFitting') or builtincategory('OST_PipeFitting') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_ConduitFitting'))"
  andTake: "instance and (class('Pipe') or class('Duct') or class('CableTray') or class('Conduit') or builtincategory('OST_DuctFitting') or builtincategory('OST_PipeFitting') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_ConduitFitting'))"
  groupBy: "parameter(me, 'Комментарии')"
  visualizations:
    - name: "Locate collision"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            transparency: 15
            projectionLines:
              color: "#E53935"
              weight: 6
            surfaceForeground:
              color: "#E53935"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            transparency: 35
            projectionLines:
              color: "#43A047"
              weight: 6
            surfaceForeground:
              color: "#43A047"
              pattern: "SolidFill"
              isVisible: true
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
    - name: "Select collision"
      steps:
        - type: "Select"
          elementSets: ["Target", "Dependencies"]
    - name: "Isolate collision"
      steps:
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Show with filters"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            transparency: 10
            projectionLines:
              color: "#FF9800"
              weight: 8
            surfaceForeground:
              color: "#FF9800"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideFilter"
          elementSets: ["Dependencies"]
          style:
            halftone: true
            transparency: 45
            projectionLines:
              color: "#1E88E5"
              weight: 5
            surfaceForeground:
              color: "#1E88E5"
              pattern: "SolidFill"
              isVisible: true
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Test all graphics"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: true
            transparency: 25
            detailLevel: "Fine"
            projectionLines:
              color: "#D81B60"
              weight: 7
            cutLines:
              color: "#8E24AA"
              weight: 9
            surfaceForeground:
              color: "#D81B60"
              pattern: "SolidFill"
              isVisible: true
            surfaceBackground:
              color: "#F8BBD0"
              pattern: "SolidFill"
              isVisible: true
            cutForeground:
              color: "#8E24AA"
              pattern: "SolidFill"
              isVisible: true
            cutBackground:
              color: "#E1BEE7"
              pattern: "SolidFill"
              isVisible: true
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            transparency: 55
            detailLevel: "Coarse"
            projectionLines:
              color: "#00897B"
              weight: 4
            cutLines:
              color: "#3949AB"
              weight: 6
            surfaceForeground:
              color: "#00897B"
              pattern: "SolidFill"
              isVisible: true
            surfaceBackground:
              color: "#B2DFDB"
              pattern: "SolidFill"
              isVisible: true
            cutForeground:
              color: "#3949AB"
              pattern: "SolidFill"
              isVisible: true
            cutBackground:
              color: "#C5CAE9"
              pattern: "SolidFill"
              isVisible: true
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
