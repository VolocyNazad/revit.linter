# Revit Linter diagnostics configuration (format version 2).
# This single file holds every configured check. The "type" field selects the module:
#   custom    - a user-defined element check;
#   collision - a check that compares elements with each other;
#   parameter - a project-parameter check;
#   builtIn   - an override of a check that ships with the product. Such an entry may
#               contain only code, isActive, severity and isHidden.
#
# Settings changed in the Diagnostics pane are written back to this file; comments and
# the order of the rules are preserved. A rule with isHidden: true is not shown in the
# interface, does not run and does not appear in reports.
#
# The "section" comment lines mark the discipline blocks used by the welcome wizard;
# keep them in pairs.
#
# File format version for compatibility checks.

version: 2
rules:
- type: "custom"
  code: "CSTM001"
  description: "Generic models with an empty Comments parameter"
  tags: ["Modeling", "Parameters", "Project"]
  message: "'{elementName}' ({elementId}) is a generic model with an empty Comments parameter. Fill it in to describe the element."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_GenericModel')"
  check: "!isnullorempty(parameter(me, 'ALL_MODEL_INSTANCE_COMMENTS'))"
  visualizations:
    # Single-step examples: every supported visualization operation.
    - name: "Focus on the element"
      steps:
        - type: "Show"
          elementSets: ["Target"]

    - name: "Select the element"
      steps:
        - type: "Select"
          elementSets: ["Target"]

    - name: "Isolate the element"
      steps:
        - type: "Isolate"
          elementSets: ["Target"]

    - name: "Crop a 3D view around the element"
      steps:
        - type: "Cut"
          elementSets: ["Target"]

    - name: "Color the element"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }

    - name: "Color through a temporary filter"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 25
            projectionLines: { color: "#A07C2C", pattern: "Solid", weight: 6 }
            cutLines: { color: "#6E5620", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A07C2C", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E6D3AC", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#6E5620", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#F0E4C8", pattern: "SolidFill", isVisible: true }

    # Combined examples: ordered steps solve a recognizable review task.
    - name: "Inspect closely: color, crop, focus"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Cut"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target"]

    - name: "Remove distractions: isolate, color, focus"
      steps:
        - type: "Isolate"
          elementSets: ["Target"]
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Show"
          elementSets: ["Target"]

    - name: "Coordinate: filter color, select, focus"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#4A6E94", pattern: "Solid", weight: 6 }
            cutLines: { color: "#34506E", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#4A6E94", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C3D2E2", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#34506E", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DDE6F0", pattern: "SolidFill", isVisible: true }
        - type: "Select"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM101"
  description: "Ducts and pipes without a system"
  tags: ["MEP", "Systems", "Project"]
  message: "'{elementName}' ({elementId}) is not assigned to a system."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_DuctCurves') or builtincategory('OST_PipeCurves'))"
  check: "!isnullorempty(parameter(me, 'RBS_SYSTEM_NAME_PARAM'))"
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM201"
  description: "Doors and windows without a mark"
  tags: ["Project"]
  message: "'{elementName}' ({elementId}) has an empty mark."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_Doors') or builtincategory('OST_Windows'))"
  check: "!isnullorempty(parameter(me, 'ALL_MODEL_MARK'))"
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM202"
  description: "Mirrored doors"
  tags: ["Doors", "Modeling", "Project"]
  message: "Door '{elementName}' ({elementId}) is mirrored: its handing differs from the family."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_Doors')"
  check: "!property('Mirrored')"
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM203"
  description: "Rooms without a meaningful name"
  tags: ["Project"]
  message: "Room '{elementName}' ({elementId}) has an empty or default name."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnullorempty(parameter(me, 'ROOM_NAME')) & parameter(me, 'ROOM_NAME') != 'Room' & parameter(me, 'ROOM_NAME') != 'Помещение'"
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM204"
  description: "Unplaced rooms"
  tags: ["Project"]
  message: "Room '{elementName}' ({elementId}) is not placed in the model."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnull(property('Location'))"
  fixes:
    - name: "Delete unplaced room"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

# >>> section: mep — MEP systems
- type: "collision"
  code: "CLSN101"
  description: "Ducts;Pipes"
  tags: ["MEP", "Project"]
  severity: "Error"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_DuctCurves') or builtincategory('OST_FlexDuctCurves') or builtincategory('OST_DuctFitting') or builtincategory('OST_DuctAccessory'))"
  andTake: "instance and (builtincategory('OST_PipeCurves') or builtincategory('OST_FlexPipeCurves') or builtincategory('OST_PipeFitting') or builtincategory('OST_PipeAccessory'))"
  groupBy: "'all'"
  visualizations:
    - name: "Isolate and inspect"
      steps:
        - type: "DetailLevel"
          detailLevel: "Fine"
        - type: "DisplayStyle"
          displayStyle: "Shading"
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Cut and inspect"
      steps:
        - type: "DetailLevel"
          detailLevel: "Fine"
        - type: "DisplayStyle"
          displayStyle: "Shading"
        - type: "SetCategoryVisibility"
          categories: ["OST_DuctCurves", "OST_FlexDuctCurves", "OST_DuctFitting", "OST_DuctAccessory", "OST_PipeCurves", "OST_FlexPipeCurves", "OST_PipeFitting", "OST_PipeAccessory", "OST_SectionBox"]
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A07C2C", pattern: "Solid", weight: 6 }
            cutLines: { color: "#6E5620", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A07C2C", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E6D3AC", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#6E5620", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#F0E4C8", pattern: "SolidFill", isVisible: true }
        - type: "OverrideFilter"
          elementSets: ["Dependencies"]
          style:
            halftone: true
            transparency: 35
            projectionLines: { color: "#5B7FA6", pattern: "Solid", weight: 6 }
            cutLines: { color: "#3E5A78", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5B7FA6", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C3D2E2", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#3E5A78", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DDE6F0", pattern: "SolidFill", isVisible: true }
        - type: "Select"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Select"
      steps:
        - type: "Select"
          elementSets: ["Target"]
