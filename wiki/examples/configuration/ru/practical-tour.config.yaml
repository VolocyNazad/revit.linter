# Проверка для практического обучения. Revit Linter устанавливает и обновляет этот файл автоматически.
# Это проверка коллизий стен, перекрытий, крыш, труб, воздуховодов, лотков, коробов
# и соединительных деталей (пайплайны CLSN101), чтобы в обучении были замечания
# с видимой геометрией, а не мусорные элементы с маленькой или невидимой геометрией.

# Версия формата файла для проверок совместимости.
version: 1
rules:
- code: "TOUR001"
  description: "Практическое обучение: изучение коллизии модели"
  message: "Коллизия: элемент «{elementName}» ({elementId}) пересекает элементы: {intersection.count} — «{intersection.elementNames}» ({intersection.elementIds})."
  severity: "Message"
  isActive: false
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_Walls') or builtincategory('OST_Floors') or builtincategory('OST_Roofs') or builtincategory('OST_PipeCurves') or builtincategory('OST_FlexPipeCurves') or builtincategory('OST_PipeFitting') or builtincategory('OST_PipeAccessory') or builtincategory('OST_DuctCurves') or builtincategory('OST_FlexDuctCurves') or builtincategory('OST_DuctFitting') or builtincategory('OST_DuctAccessory') or builtincategory('OST_CableTray') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_Conduit') or builtincategory('OST_ConduitFitting'))"
  andTake: "instance and (builtincategory('OST_Walls') or builtincategory('OST_Floors') or builtincategory('OST_Roofs') or builtincategory('OST_PipeCurves') or builtincategory('OST_FlexPipeCurves') or builtincategory('OST_PipeFitting') or builtincategory('OST_PipeAccessory') or builtincategory('OST_DuctCurves') or builtincategory('OST_FlexDuctCurves') or builtincategory('OST_DuctFitting') or builtincategory('OST_DuctAccessory') or builtincategory('OST_CableTray') or builtincategory('OST_CableTrayFitting') or builtincategory('OST_Conduit') or builtincategory('OST_ConduitFitting'))"
  groupBy: "'all'"
  fixes:
    - name: "Удалить элемент"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
    - name: "Удалить связанные элементы"
      steps:
        - type: "Delete"
          elementSets: ["Dependencies"]
  visualizations:
    - name: "Изолировать и осмотреть"
      steps:
        - type: "DetailLevel"
          detailLevel: "Fine"
        - type: "DisplayStyle"
          displayStyle: "Shading"
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Подрезать и осмотреть"
      steps:
        - type: "DetailLevel"
          detailLevel: "Fine"
        - type: "DisplayStyle"
          displayStyle: "Shading"
        # Обучение проверяет всю модель, поэтому все проверяемые категории остаются видимыми:
        # скрываются только области видимости (OST_VolumeOfInterest) и уровни (OST_Levels).
        - type: "SetCategoryVisibility"
          categories: ["OST_Walls", "OST_Floors", "OST_Roofs", "OST_PipeCurves", "OST_FlexPipeCurves", "OST_PipeFitting", "OST_PipeAccessory", "OST_DuctCurves", "OST_FlexDuctCurves", "OST_DuctFitting", "OST_DuctAccessory", "OST_CableTray", "OST_CableTrayFitting", "OST_Conduit", "OST_ConduitFitting", "OST_SectionBox"]
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A07C2C", pattern: "Solid", weight: 6 }
            cutLines: { color: "#6E5620", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A07C2C", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E6D3AC", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#6E5620", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#F0E4C8", pattern: "SolidFill", isVisible: true }
        - type: "OverrideFilter"
          elementSets: ["Dependencies"]
          style:
            halftone: true
            transparency: 35
            projectionLines: { color: "#5B7FA6", pattern: "Solid", weight: 6 }
            cutLines: { color: "#3E5A78", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5B7FA6", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C3D2E2", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#3E5A78", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DDE6F0", pattern: "SolidFill", isVisible: true }
        - type: "Select"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
    - name: "Выбрать"
      steps:
        - type: "Select"
          elementSets: ["Target"]
