# Пользовательские проверки элементов. Скопируйте файл в папку конфигурации под именем config.yaml.
# Элемент считается корректным, когда "check" возвращает true; остальные отобранные элементы попадают в отчёт.
# Параметры заданы именами BuiltInParameter, поэтому правила работают в Revit на любом языке.

- code: "CSTM001"
  description: "Экземпляры обобщённых моделей"
  message: "'{elementName}' ({elementId}) — обобщённая модель. Перенесите элемент в подходящую категорию или добавьте в список игнорирования."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_GenericModel')"
  check: "isnull(property('Id'))"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- code: "CSTM101"
  description: "Воздуховоды и трубы без системы"
  message: "'{elementName}' ({elementId}) не входит ни в одну систему."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_DuctCurves') or builtincategory('OST_PipeCurves'))"
  check: "!isnullorempty(parameter(me, 'RBS_SYSTEM_NAME_PARAM'))"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- code: "CSTM201"
  description: "Двери и окна без марки"
  message: "У элемента '{elementName}' ({elementId}) не заполнена марка."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_Doors') or builtincategory('OST_Windows'))"
  check: "!isnullorempty(parameter(me, 'ALL_MODEL_MARK'))"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- code: "CSTM202"
  description: "Зеркально отражённые двери"
  message: "Дверь '{elementName}' ({elementId}) отражена зеркально: открывание не совпадает с семейством."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_Doors')"
  check: "!property('Mirrored')"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- code: "CSTM203"
  description: "Помещения без осмысленного имени"
  message: "У помещения '{elementName}' ({elementId}) пустое имя или имя по умолчанию."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnullorempty(parameter(me, 'ROOM_NAME')) & parameter(me, 'ROOM_NAME') != 'Room' & parameter(me, 'ROOM_NAME') != 'Помещение'"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- code: "CSTM204"
  description: "Неразмещённые помещения"
  message: "Помещение '{elementName}' ({elementId}) не размещено в модели."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnull(property('Location'))"
  fixes:
    - name: "Удалить неразмещённое помещение"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]
