# Revit Linter diagnostics configuration (format version 2).
# This single file holds every configured check. The "type" field selects the module:
#   custom    - a user-defined element check;
#   collision - a check that compares elements with each other;
#   parameter - a project-parameter check;
#   builtIn   - an override of a check that ships with the product. Such an entry may
#               contain only code, isActive, severity and isHidden.
#
# Settings changed in the Diagnostics pane are written back to this file; comments and
# the order of the rules are preserved. A rule with isHidden: true is not shown in the
# interface, does not run and does not appear in reports.
#
# The "section" comment lines mark the discipline blocks used by the welcome wizard;
# keep them in pairs.
#
# File format version for compatibility checks.

version: 2
rules:
- type: "custom"
  code: "CSTM001"
  description: "Обобщённые модели с незаполненным параметром «Комментарии»"
  tags: ["Моделирование", "Параметры", "Project"]
  message: "'{elementName}' ({elementId}) — у обобщённой модели не заполнен параметр «Комментарии». Заполните его, чтобы описать элемент."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_GenericModel')"
  check: "!isnullorempty(parameter(me, 'ALL_MODEL_INSTANCE_COMMENTS'))"
  visualizations:
    # Одиночные примеры: все поддерживаемые операции визуализации.
    - name: "Сфокусироваться на элементе"
      steps:
        - type: "Show"
          elementSets: ["Target"]

    - name: "Выбрать элемент"
      steps:
        - type: "Select"
          elementSets: ["Target"]

    - name: "Изолировать элемент"
      steps:
        - type: "Isolate"
          elementSets: ["Target"]

    - name: "Подрезать 3D-вид вокруг элемента"
      steps:
        - type: "Cut"
          elementSets: ["Target"]

    - name: "Окрасить элемент"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }

    - name: "Окрасить временным фильтром"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 25
            projectionLines: { color: "#A07C2C", pattern: "Solid", weight: 6 }
            cutLines: { color: "#6E5620", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A07C2C", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E6D3AC", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#6E5620", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#F0E4C8", pattern: "SolidFill", isVisible: true }

    # Комбинированные примеры: последовательности решают понятные задачи проверки.
    - name: "Изучить подробно: окрасить, подрезать, сфокусироваться"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#A63D40", pattern: "Solid", weight: 6 }
            cutLines: { color: "#7C2D30", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#A63D40", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#E3BFB9", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#7C2D30", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#EFD5D1", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Cut"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target"]

    - name: "Убрать лишнее: изолировать, окрасить, сфокусироваться"
      steps:
        - type: "Isolate"
          elementSets: ["Target"]
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            halftone: false
            transparency: 35
            projectionLines: { color: "#5E8261", pattern: "Solid", weight: 6 }
            cutLines: { color: "#425C43", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#5E8261", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C6D6C6", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#425C43", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DCE6DC", pattern: "SolidFill", isVisible: true }
        - type: "Show"
          elementSets: ["Target"]

    - name: "Скоординировать: фильтр, выбор, фокус"
      steps:
        - type: "OverrideFilter"
          elementSets: ["Target"]
          style:
            halftone: false
            transparency: 15
            projectionLines: { color: "#4A6E94", pattern: "Solid", weight: 6 }
            cutLines: { color: "#34506E", pattern: "Solid", weight: 8 }
            surfaceForeground: { color: "#4A6E94", pattern: "SolidFill", isVisible: true }
            surfaceBackground: { color: "#C3D2E2", pattern: "SolidFill", isVisible: true }
            cutForeground: { color: "#34506E", pattern: "SolidFill", isVisible: true }
            cutBackground: { color: "#DDE6F0", pattern: "SolidFill", isVisible: true }
        - type: "Select"
          elementSets: ["Target"]
        - type: "Show"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM101"
  description: "Воздуховоды и трубы без системы"
  tags: ["Инженерные системы", "Системы", "Project"]
  message: "'{elementName}' ({elementId}) не входит ни в одну систему."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_DuctCurves') or builtincategory('OST_PipeCurves'))"
  check: "!isnullorempty(parameter(me, 'RBS_SYSTEM_NAME_PARAM'))"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM201"
  description: "Двери и окна без марки"
  tags: ["Project"]
  message: "У элемента '{elementName}' ({elementId}) не заполнена марка."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_Doors') or builtincategory('OST_Windows'))"
  check: "!isnullorempty(parameter(me, 'ALL_MODEL_MARK'))"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM202"
  description: "Зеркально отражённые двери"
  tags: ["Двери", "Моделирование", "Project"]
  message: "Дверь '{elementName}' ({elementId}) отражена зеркально: открывание не совпадает с семейством."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_Doors')"
  check: "!property('Mirrored')"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM203"
  description: "Помещения без осмысленного имени"
  tags: ["Project"]
  message: "У помещения '{elementName}' ({elementId}) пустое имя или имя по умолчанию."
  severity: "Warning"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnullorempty(parameter(me, 'ROOM_NAME')) & parameter(me, 'ROOM_NAME') != 'Room' & parameter(me, 'ROOM_NAME') != 'Помещение'"
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

- type: "custom"
  code: "CSTM204"
  description: "Неразмещённые помещения"
  tags: ["Project"]
  message: "Помещение '{elementName}' ({elementId}) не размещено в модели."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "room"
  check: "!isnull(property('Location'))"
  fixes:
    - name: "Удалить неразмещённое помещение"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
  visualizations:
    - name: "Показать и выбрать"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]

