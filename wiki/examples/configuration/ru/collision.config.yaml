# Проверки коллизий. Скопируйте файл в папку конфигурации под именем collision.config.yaml.
# Элементы сравниваются только внутри одного документа: связанные модели не участвуют.
# Правила отбирают элементы по категории, поэтому запускайте блок в модели своего раздела
# или сузьте его через takeDocument, например: "contains(property('Title'), '_ОВ')".
# groupBy здесь константа, поэтому каждый отобранный элемент сравнивается с каждым.
# Строки-комментарии "section" отмечают блоки разделов для мастера приветствия; сохраняйте их парами.

# >>> section: mep — Инженерные системы (ИОС)
- code: "CLSN101"
  description: "Воздуховоды с трубами"
  message: "Воздуховод '{elementName}' ({elementId}) пересекает элементов: {intersection.count} — '{intersection.elementNames}' ({intersection.elementIds})."
  severity: "Error"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and (builtincategory('OST_DuctCurves') or builtincategory('OST_FlexDuctCurves') or builtincategory('OST_DuctFitting') or builtincategory('OST_DuctAccessory'))"
  andTake: "instance and (builtincategory('OST_PipeCurves') or builtincategory('OST_FlexPipeCurves') or builtincategory('OST_PipeFitting') or builtincategory('OST_PipeAccessory'))"
  groupBy: "'all'"
  visualizations:
    - name: "Найти коллизию"
      steps:
        - type: "OverrideElements"
          elementSets: ["Target"]
          style:
            projectionLines: { color: "#E53935", weight: 6 }
            surfaceForeground: { color: "#E53935", pattern: "SolidFill", isVisible: true }
        - type: "OverrideElements"
          elementSets: ["Dependencies"]
          style:
            projectionLines: { color: "#43A047", weight: 6 }
            surfaceForeground: { color: "#43A047", pattern: "SolidFill", isVisible: true }
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
        - type: "Cut"
          elementSets: ["Target", "Dependencies"]
    - name: "Изолировать коллизию"
      steps:
        - type: "Isolate"
          elementSets: ["Target", "Dependencies"]
        - type: "Show"
          elementSets: ["Target", "Dependencies"]
