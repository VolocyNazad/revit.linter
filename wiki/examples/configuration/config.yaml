- code: "CSTM001"
  description: "custom"
  message: "For the element named '{elementName}' with identifier '{elementId}', the 'Марка' and/or 'Комментарии' parameters are incorrectly set. Execution time '{duration}' ms."
  isObsolete: true
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_Walls')"
  check: "parameter(me, 'Комментарии') == 'Ура!' & parameter(me, 'Марка') == 'Ура!'"
  fixes:
    - name: "Delete"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
  visualizations:
    - name: "Show and select"
      steps:
        - type: "Show"
          elementSets: ["Target"]
        - type: "Select"
          elementSets: ["Target"]
- code: "CSTM002"
  description: "custom"
  message: "For the element named '{elementName}' with identifier '{elementId}', the name is incorrectly set."
  severity: "Message"
  isActive: false
  isObsolete: true
  obsoleteDescription: "Some text describing the reason the check is obsolete"
  takeDocument: "true"
  take: "instance and builtincategory('OST_Walls')"
  check: "property('Name') == '1'"
- code: "CSTM003"
  description: "custom"
  message: "Element named '{elementName}' with identifier '{elementId}'."
  severity: "Message"
  isActive: false
  isObsolete: true
  obsoleteDescription: "Some text describing the reason the check is obsolete"
  takeDocument: "true"
  take: "instance and class('FamilyInstance')"
  check: "property('SuperComponent') == null"
- code: "CSTM004"
  description: "custom"
  message: "Element named '{elementName}' with identifier '{elementId}'."
  severity: "Message"
  isActive: false
  isObsolete: true
  obsoleteDescription: "Some text describing the reason the check is obsolete"
  takeDocument: "true"
  take: "instance and class('FamilyInstance')"
  check: "property('Mirrored') == true"
- code: "FIXTEST001"
  description: "Safe test for the Delete fix pipeline"
  message: "The test wall named '{elementName}' with identifier '{elementId}' can be deleted."
  severity: "Message"
  takeDocument: "!property('IsFamilyDocument')"
  take: "instance and builtincategory('OST_Walls')"
  check: "parameter(me, 'Комментарии') != 'FIX_TEST'"
  fixes:
    - name: "Delete"
      steps:
        - type: "Delete"
          elementSets: ["Target"]
